# A broker for the demo only, on ports that do not clash with a local RabbitMQ.
services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: rabbitmq-message-bus-demo
    ports:
      - '5681:5672' # AMQP
      - '15681:15672' # management UI, guest / guest
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 3s
      timeout: 5s
      retries: 20
